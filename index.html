<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TPrompter7L</title>

    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="Teleprompter7L.png">

    <style>
        :root { --panel-bg: rgba(20, 20, 20, 0.85); --accent: #0f0; }
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }

        /* Contenedor de la cámara */
        #cam-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #cameraPreview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            display: none; /* Se activa mediante script */
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.45);
            z-index: 2;
            pointer-events: none;
        }

        /* Viewport con efecto de desenfoque/desvanecimiento inferior */
        #viewport { 
            position: relative;
            z-index: 10;
            height: 100vh; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            -webkit-mask-image: linear-gradient(to bottom, black 0%, black 18%, rgba(0,0,0,0.15) 30%, transparent 70%);
            mask-image: linear-gradient(to bottom, black 0%, black 18%, rgba(0,0,0,0.15) 30%, transparent 70%);
        }
        #viewport::-webkit-scrollbar { display: none; }

        #margin-box { width: 85%; padding-top: 15vh; padding-bottom: 85vh; transition: all 0.3s ease; }
        .mirror-active { transform: scaleX(-1) !important; }

        #text { 
            filter: blur(0px);
            width: 100%; 
            font-size: 45px; 
            line-height: 1.6; 
            outline: none; 
            white-space: pre-wrap; 
            text-align: center;
            
            /* EFECTO DE COLOR EXACTO EN LA LÍNEA GUÍA */
            background: linear-gradient(
                to bottom, 
                #FFFF00 0%, 
                #FFFF00 20vh, /* Amarillo neón hasta exactamente el 20% de la pantalla (Línea Guía) */
                #FFFFFF 20vh, 
                #FFFFFF 100%  /* Blanco de la barra hacia abajo */
            );
            background-attachment: fixed; /* Mantiene la división fija en la pantalla sin importar el scroll */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.9));
        }

        #audio-container { position: fixed; top: 0; left: 0; width: 100%; height: 6px; background: #111; z-index: 2000; }
        #audio-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.05s; }
        #threshold-line { position: absolute; top: 0; height: 100%; width: 2px; background: red; z-index: 2001; }
        
        /* Línea guía al 20% superior */
        #guide { position: fixed; top: 20%; left: 0; width: 100%; height: 2px; background: rgba(0, 255, 0, 0.4); pointer-events: none; z-index: 15; }

        .float-btn {
            position: fixed; top: 20px; width: 50px; height: 50px;
            background: rgba(50, 50, 50, 0.7); border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 22px; z-index: 3000; border: 1px solid #555;
            backdrop-filter: blur(5px); cursor: pointer;
        }
        #menuToggle { right: 20px; }
        #fileToggle { left: 20px; }

        /* Barra flotante de grabación */
        #rec-control-bar {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(20, 20, 20, 0.85);
            padding: 10px 18px;
            border-radius: 30px;
            border: 1px solid #444;
            backdrop-filter: blur(10px);
            z-index: 2800;
            align-items: center;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        /* Ocultar la barra si cualquier panel lateral está abierto */
        body.panel-open #rec-control-bar {
            display: none !important;
        }

        .rec-btn {
            background: #333; color: white; border: none; padding: 10px 16px;
            border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 13px;
        }
        #toggleCamBtnBar { background: #0288d1; }
        #recordBtn { background: #d32f2f; display: none; }
        #pauseRecBtn { background: #f57c00; display: none; }
        #stopRecBtn { background: #388e3c; display: none; }
        #recTimer { font-family: monospace; font-size: 14px; color: #ff5252; min-width: 45px; display: none; }

        /* Panel de vista previa del video grabado */
        #previewModal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9);
            z-index: 4000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }
        #recordedVideo {
            width: 100%;
            max-width: 500px;
            max-height: 65vh;
            border-radius: 15px;
            border: 1px solid #444;
            background: #000;
            margin-bottom: 20px;
        }
        .modal-buttons {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 500px;
        }
        .modal-buttons button {
            flex: 1;
            height: 48px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            color: white;
        }
        #downloadVideoBtn { background: #2e7d32; }
        #discardVideoBtn { background: #c62828; }

        .side-panel {
            position: fixed; bottom: 0; left: 0; width: 100%; height: auto;
            max-height: 80vh; background: var(--panel-bg); z-index: 3500;
            border-top: 1px solid #444; border-radius: 25px 25px 0 0;
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 25px; box-sizing: border-box; overflow-y: auto; backdrop-filter: blur(15px);
        }
        .side-panel.open { transform: translateY(0); }

        .section-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 2px; text-align: center; display: block; margin-bottom: 20px; }

        .file-group { background: rgba(255,255,255,0.05); border: 1px solid #333; padding: 15px; border-radius: 15px; margin-bottom: 15px; }
        .file-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 10px; }

        #noteName { width: 100%; background: #000; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 10px; outline: none; box-sizing: border-box; margin-bottom: 10px; font-size: 16px; }

        button.action-btn { width: 100%; height: 50px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; margin-bottom: 5px; color: white; }
        .save-btn { background: #1b5e20; }
        .open-btn { background: #333; border: 1px solid #555; }
        .clear-btn { background: #b71c1c; margin-top: 10px; }

        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .step-control {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            background: #111; padding: 10px; border-radius: 15px; border: 1px solid #333;
        }
        .step-label { font-size: 10px; color: #888; text-transform: uppercase; }
        .val-display { font-size: 20px; font-weight: bold; color: var(--accent); min-width: 35px; text-align: center; font-family: monospace; }
        button.ctrl-btn { background: #333; color: white; border: none; width: 42px; height: 42px; border-radius: 12px; font-size: 20px; cursor: pointer; }

        #startBtn { width: 100%; height: 55px; background: #222; color: white; border: 1px solid #444; border-radius: 15px; font-weight: bold; font-size: 16px; margin-bottom: 10px; }
        #startBtn.active { background: #d32f2f; border-color: #ff5555; }

        .footer-row { display: flex; gap: 10px; margin-top: 12px; }
        .footer-row button { flex: 1; height: 45px; background: #222; border: 1px solid #333; color: white; border-radius: 12px; }
    </style>
</head>
<body>

<div id="cam-container">
    <video id="cameraPreview" autoplay playsinline muted></video>
</div>
<div id="overlay"></div>

<div id="audio-container"><div id="audio-bar"></div><div id="threshold-line"></div></div>
<div id="guide"></div>

<div id="fileToggle" class="float-btn">☰</div>
<div id="menuToggle" class="float-btn">⚙️</div>

<!-- Barra de control flotante inferior -->
<div id="rec-control-bar">
    <button id="toggleCamBtnBar" class="rec-btn">📷 Activar Cámara</button>
    <button id="recordBtn" class="rec-btn">⏺️ Grabar</button>
    <button id="pauseRecBtn" class="rec-btn">⏸️ Pausar</button>
    <button id="stopRecBtn" class="rec-btn">⏹️ Stop</button>
    <span id="recTimer">00:00</span>
</div>

<div id="previewModal">
    <span class="section-label" style="margin-bottom:10px;">Video Grabado</span>
    <video id="recordedVideo" controls playsinline></video>
    <div class="modal-buttons">
        <button id="downloadVideoBtn">💾 Guardar / Descargar</button>
        <button id="discardVideoBtn">🗑️ Eliminar</button>
    </div>
</div>

<div id="viewport">
    <div id="margin-box">
        <div id="text" contenteditable="true" spellcheck="false">¡Bienvenido!
Escribe tu guion aquí.</div>
    </div>
</div>

<div id="filePanel" class="side-panel">
    <span class="section-label">Gestor de Documentos</span>
    <div class="file-group">
        <label>IMPORTAR</label>
        <button class="action-btn open-btn" onclick="document.getElementById('importInput').click()">📂 ABRIR ARCHIVO (.txt)</button>
        <input type="file" id="importInput" style="display:none" accept=".txt" onchange="importTxt(this)">
    </div>
    <div class="file-group">
        <label>EXPORTAR</label>
        <input id="noteName" type="text" placeholder="Nombre del nuevo archivo...">
        <button class="action-btn save-btn" onclick="exportTxt()">📥 GUARDAR COMO .TXT</button>
    </div>
    <button class="action-btn clear-btn" onclick="newFile()">🗑️ LIMPIAR TEXTO</button>
</div>

<div id="configPanel" class="side-panel">
    <span class="section-label">Ajustes de Lectura</span>
    <button id="startBtn">🎙️ ACTIVAR SENSOR POR VOZ</button>

    <div class="controls-grid">
        <div class="step-control">
            <span class="step-label">Velocidad</span>
            <div style="display:flex; align-items:center; gap:10px;">
                <button class="ctrl-btn" onclick="changeVal('speed', -1)">-</button>
                <span id="speedVal" class="val-display">25</span>
                <button class="ctrl-btn" onclick="changeVal('speed', 1)">+</button>
            </div>
        </div>
        <div class="step-control">
            <span class="step-label">Sensibilidad</span>
            <div style="display:flex; align-items:center; gap:10px;">
                <button class="ctrl-btn" onclick="changeVal('sens', -1)">-</button>
                <span id="sensVal" class="val-display">15</span>
                <button class="ctrl-btn" onclick="changeVal('sens', 1)">+</button>
            </div>
        </div>
        <div class="step-control">
            <span class="step-label">Texto (A)</span>
            <div style="display:flex; align-items:center; gap:10px;">
                <button class="ctrl-btn" onclick="changeVal('fontSize', -2)">-</button>
                <span id="fontSizeVal" class="val-display">45</span>
                <button class="ctrl-btn" onclick="changeVal('fontSize', 2)">+</button>
            </div>
        </div>
        <div class="step-control">
            <span class="step-label">Márgenes</span>
            <div style="display:flex; align-items:center; gap:10px;">
                <button class="ctrl-btn" onclick="changeVal('margin', -5)">-</button>
                <span id="marginVal" class="val-display">85</span>
                <button class="ctrl-btn" onclick="changeVal('margin', 5)">+</button>
            </div>
        </div>
    </div>

    <div class="footer-row">
        <button id="alignBtn">≡</button>
        <button id="mirrorBtn">🪞</button>
        <button id="resetBtn">🔄</button>
        <button id="camToggleBtn">📷 Switch Cam</button>
    </div>
</div>

<script>
    const viewport = document.getElementById('viewport'), textElem = document.getElementById('text'),
          marginBox = document.getElementById('margin-box'), audioBar = document.getElementById('audio-bar'),
          thresholdLine = document.getElementById('threshold-line'), configPanel = document.getElementById('configPanel'),
          filePanel = document.getElementById('filePanel'), startBtn = document.getElementById('startBtn'),
          cameraVideo = document.getElementById('cameraPreview'), camToggleBtn = document.getElementById('camToggleBtn');

    const toggleCamBtnBar = document.getElementById('toggleCamBtnBar');
    const recordBtn = document.getElementById('recordBtn');
    const pauseRecBtn = document.getElementById('pauseRecBtn');
    const stopRecBtn = document.getElementById('stopRecBtn');
    const recTimer = document.getElementById('recTimer');
    const previewModal = document.getElementById('previewModal');
    const recordedVideo = document.getElementById('recordedVideo');
    const downloadVideoBtn = document.getElementById('downloadVideoBtn');
    const discardVideoBtn = document.getElementById('discardVideoBtn');

    let audioContext, analyser, dataArray, isRunning = false, scrollPos = 0;
    let mediaStream = null, isCameraActive = false, currentFacingMode = 'user';
    let mediaRecorder = null, recordedChunks = [], timerInterval = null, secondsElapsed = 0, recordedBlob = null;
    let selectedMimeType = '';

    let config = { speed: 25, sens: 15, fontSize: 45, margin: 85, alignIdx: 1, mirror: false };
    const aligns = ['left', 'center', 'right'];

    let wakeLock = null;
    async function requestWakeLock() {
        try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
    }
    function releaseWakeLock() {
        if (wakeLock !== null) { wakeLock.release().then(() => { wakeLock = null; }); }
    }
    document.addEventListener('visibilitychange', async () => {
        if (wakeLock !== null && document.visibilityState === 'visible') await requestWakeLock();
    });

    // --- PROCESAMIENTO Y CAMBIO DE COLOR DE LÍNEAS POR ENCIMA DE LA GUÍA ---
    function formatLines() {
        const rawLines = textElem.innerText.split('\n');
        textElem.innerHTML = rawLines.map(line => `<span class="line-node">${line || '&nbsp;'}</span>`).join('');
    }

    function checkLinesPosition() {
        const guideY = window.innerHeight * 0.20; // 20% coincidente con top: 20% del CSS
        const lines = textElem.querySelectorAll('.line-node');

        lines.forEach(line => {
            const rect = line.getBoundingClientRect();
            // Si la parte inferior de la línea sobrepasa la guía (está por encima)
            if (rect.bottom <= guideY + (rect.height * 0.5)) {
                line.classList.add('passed-guide');
            } else {
                line.classList.remove('passed-guide');
            }
        });
    }

    // Monitorear cambios manuales en el texto para no perder la estructura de span
    let isFormatting = false;
    textElem.addEventListener('input', () => {
        if (isFormatting) return;
        isFormatting = true;
        const selection = window.getSelection();
        formatLines();
        isFormatting = false;
    });

    // Evento al desplazarse manualmente el scroll
    viewport.addEventListener('scroll', checkLinesPosition);

    // Gestión de visibilidad de paneles laterales
    function checkPanelState() {
        if (configPanel.classList.contains('open') || filePanel.classList.contains('open')) {
            document.body.classList.add('panel-open');
        } else {
            document.body.classList.remove('panel-open');
        }
    }

    document.getElementById('menuToggle').onclick = () => { 
        filePanel.classList.remove('open'); 
        configPanel.classList.toggle('open'); 
        checkPanelState();
    };
    
    document.getElementById('fileToggle').onclick = () => { 
        configPanel.classList.remove('open'); 
        filePanel.classList.toggle('open'); 
        checkPanelState();
    };

    function newFile() { 
        if(confirm("¿Limpiar el texto actual?")) {
            textElem.innerText = "Escribe o sube un archivo..."; 
            formatLines();
            filePanel.classList.remove('open'); 
            checkPanelState();
        }
    }

    function exportTxt() {
        const text = textElem.innerText;
        const name = document.getElementById('noteName').value.trim() || "mi_guion";
        const blob = new Blob([text], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `${name}.txt`; a.click();
        URL.revokeObjectURL(url);
        filePanel.classList.remove('open');
        checkPanelState();
    }

    function importTxt(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            textElem.innerText = e.target.result;
            formatLines();
            checkLinesPosition();
            filePanel.classList.remove('open');
            checkPanelState();
            alert("¡Archivo cargado con éxito!");
        };
        reader.readAsText(file);
        input.value = '';
    }

    function saveConfig() { localStorage.setItem('tele_settings_only', JSON.stringify(config)); }
    function loadData() {
        const savedSettings = localStorage.getItem('tele_settings_only');
        if (savedSettings) { config = JSON.parse(savedSettings); applyConfig(); }
    }

    function applyConfig() {
        document.getElementById('speedVal').innerText = config.speed;
        document.getElementById('sensVal').innerText = config.sens;
        document.getElementById('fontSizeVal').innerText = config.fontSize;
        document.getElementById('marginVal').innerText = config.margin;
        thresholdLine.style.left = config.sens + "%";
        textElem.style.fontSize = config.fontSize + "px";
        marginBox.style.width = config.margin + "%";
        textElem.style.textAlign = aligns[config.alignIdx];
        if(config.mirror) marginBox.classList.add('mirror-active');
        else marginBox.classList.remove('mirror-active');
        checkLinesPosition();
    }

    function changeVal(type, delta) {
        if(type === 'fontSize') config[type] = Math.max(10, Math.min(120, config[type] + delta));
        else if(type === 'margin') config[type] = Math.max(20, Math.min(100, config[type] + delta));
        else config[type] = Math.max(1, Math.min(100, config[type] + delta));
        applyConfig(); saveConfig();
    }

    document.getElementById('alignBtn').onclick = () => { config.alignIdx = (config.alignIdx + 1) % 3; applyConfig(); saveConfig(); };
    document.getElementById('mirrorBtn').onclick = () => { config.mirror = !config.mirror; applyConfig(); saveConfig(); };
    document.getElementById('resetBtn').onclick = () => { scrollPos = 0; viewport.scrollTop = 0; checkLinesPosition(); };

    // --- CÁMARA Y CONTROLES ---
    async function startCamera() {
        try {
            if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
            mediaStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: currentFacingMode },
                audio: true
            });
            cameraVideo.srcObject = mediaStream;
            cameraVideo.style.display = 'block';
            isCameraActive = true;
            
            // Actualizar interfaz
            toggleCamBtnBar.innerText = "📷 Apagar Cámara";
            toggleCamBtnBar.style.background = "#c62828";
            recordBtn.style.display = 'inline-block';

            if(isRunning && audioContext) {
                initAudioSensor(mediaStream);
            }
        } catch (err) {
            alert("No se pudo acceder a la cámara o micrófono: " + err.message);
            stopCamera();
        }
    }

    function stopCamera() {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
        }
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
            mediaStream = null;
        }
        cameraVideo.srcObject = null;
        cameraVideo.style.display = 'none';
        isCameraActive = false;

        // Resetear UI de barra flotante
        toggleCamBtnBar.innerText = "📷 Activar Cámara";
        toggleCamBtnBar.style.background = "#0288d1";
        recordBtn.style.display = 'none';
        pauseRecBtn.style.display = 'none';
        stopRecBtn.style.display = 'none';
        recTimer.style.display = 'none';
        clearInterval(timerInterval);
    }

    toggleCamBtnBar.onclick = () => {
        if (!isCameraActive) {
            startCamera();
        } else {
            stopCamera();
        }
    };

    camToggleBtn.onclick = () => {
        if (isCameraActive) {
            currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
            cameraVideo.style.transform = (currentFacingMode === 'user') ? 'scaleX(-1)' : 'none';
            startCamera();
        } else {
            startCamera();
        }
    };

    // --- SENSOR POR VOZ ---
    startBtn.onclick = async () => {
        if (!isRunning) {
            try {
                if (!mediaStream) {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                }
                initAudioSensor(mediaStream);
                isRunning = true;
                startBtn.classList.add('active');
                startBtn.innerText = "🛑 DETENER SENSOR";
                scrollLoop();
            } catch (err) {
                alert("Permiso de micrófono denegado: " + err.message);
            }
        } else {
            isRunning = false;
            startBtn.classList.remove('active');
            startBtn.innerText = "🎙️ ACTIVAR SENSOR POR VOZ";
        }
    };

    function initAudioSensor(stream) {
        if(!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
    }

    function scrollLoop() {
        if (!isRunning) return;
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        let average = sum / dataArray.length;
        let volumePercentage = Math.min(100, (average / 128) * 100);

        audioBar.style.width = volumePercentage + "%";

        if (volumePercentage > config.sens) {
            scrollPos += (config.speed / 10);
            viewport.scrollTop = scrollPos;
        } else {
            scrollPos = viewport.scrollTop;
        }

        checkLinesPosition(); // Evalúa la posición del texto a medida que hace scroll
        requestAnimationFrame(scrollLoop);
    }

    // --- GRABACIÓN Y SOPORTE MULTINAVEGADOR ---
    function getSupportedMimeType() {
        const types = [
            'video/mp4;codecs=avc1,mp4a',
            'video/mp4',
            'video/webm;codecs=vp9,opus',
            'video/webm;codecs=vp8,opus',
            'video/webm'
        ];
        for (let type of types) {
            if (MediaRecorder.isTypeSupported(type)) return type;
        }
        return '';
    }

    function updateTimerDisplay() {
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        recTimer.innerText = `${mins}:${secs}`;
    }

    recordBtn.onclick = async () => {
        if (!mediaStream || !isCameraActive) await startCamera();
        if (!mediaStream) return;

        recordedChunks = [];
        try {
            selectedMimeType = getSupportedMimeType();
            const options = selectedMimeType ? { mimeType: selectedMimeType } : {};

            mediaRecorder = new MediaRecorder(mediaStream, options);
            
            mediaRecorder.ondataavailable = (event) => {
                if (event.data && event.data.size > 0) recordedChunks.push(event.data);
            };

            mediaRecorder.onstop = () => {
                recordedBlob = new Blob(recordedChunks, { type: selectedMimeType || 'video/mp4' });
                recordedVideo.src = URL.createObjectURL(recordedBlob);
                previewModal.style.display = 'flex';
            };

            mediaRecorder.start(1000);
            
            recordBtn.style.display = 'none';
            pauseRecBtn.style.display = 'inline-block';
            pauseRecBtn.innerText = "⏸️ Pausar";
            stopRecBtn.style.display = 'inline-block';
            recTimer.style.display = 'inline-block';
            
            secondsElapsed = 0;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                secondsElapsed++;
                updateTimerDisplay();
            }, 1000);

            await requestWakeLock();
        } catch (e) {
            alert("No se pudo iniciar la grabación: " + e.message);
        }
    };

    pauseRecBtn.onclick = () => {
        if (!mediaRecorder) return;
        if (mediaRecorder.state === "recording") {
            mediaRecorder.pause();
            clearInterval(timerInterval);
            pauseRecBtn.innerText = "▶️ Reanudar";
        } else if (mediaRecorder.state === "paused") {
            mediaRecorder.resume();
            timerInterval = setInterval(() => {
                secondsElapsed++;
                updateTimerDisplay();
            }, 1000);
            pauseRecBtn.innerText = "⏸️ Pausar";
        }
    };

    stopRecBtn.onclick = () => {
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
            mediaRecorder.stop();
        }
        clearInterval(timerInterval);
        releaseWakeLock();

        recordBtn.style.display = 'inline-block';
        pauseRecBtn.style.display = 'none';
        stopRecBtn.style.display = 'none';
        recTimer.style.display = 'none';
    };

    // Modal de vista previa
    downloadVideoBtn.onclick = () => {
        if (!recordedBlob) return;
        const ext = selectedMimeType.includes('mp4') ? 'mp4' : 'webm';
        const a = document.createElement('a');
        a.href = recordedVideo.src;
        a.download = `grabacion_teleprompter.${ext}`;
        a.click();
    };

    discardVideoBtn.onclick = () => {
        if (confirm("¿Seguro que deseas eliminar esta grabación?")) {
            previewModal.style.display = 'none';
            recordedVideo.src = '';
            recordedBlob = null;
        }
    };

    // Inicializar formato y carga de datos guardados
    formatLines();
    loadData();
</script>
</body>
</html>
